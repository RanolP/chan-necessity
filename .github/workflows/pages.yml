name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-node cannot parse mise.toml's [tools] table; mise-action reads it
      # natively and installs both node and pnpm from it.
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      # Builds apps/monkey-script, then apps/website (which copies the
      # built chan-necessity.user.js into the site root).
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
